# Publica en npm al pushear un tag vX.Y.Z. Sin tokens: npm confía en la identidad
# que GitHub firma para este workflow (OIDC), y por eso hace falta id-token.
# Requiere configurar el trusted publisher en la página del paquete en npmjs.com,
# apuntando a este repo y a este archivo.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      # Una versión publicada no se puede volver a publicar. Sin esto, cualquier
      # tag sobre una versión que ya salió deja el workflow en rojo sin que haya
      # nada roto.
      - id: version
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "retrodeck@$v" version >/dev/null 2>&1; then
            echo "ya publicada: $v"
            echo "nueva=false" >> "$GITHUB_OUTPUT"
          else
            echo "nueva=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.nueva == 'true'
        run: npm publish --access public
